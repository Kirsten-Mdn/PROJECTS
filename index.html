<!DOCTYPE html>
<html lang="en">

<head>

    <title>Get Done w/ Miffy! To-Do List</title>

    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous"
        referrerpolicy="no-referrer">

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <div class="watch">

        <div id="time">00:00 AM</div>

        <div id="date">Monday, Jan 1, 2026</div>

        <div class="calendar">

            <div class="header">

                <div id="prev" class="btn">
                    <i class="fa-solid fa-circle-chevron-left"></i>
                </div>

                <div id="month-year"></div>

                <div id="next" class="btn">
                    <i class="fa-solid fa-circle-chevron-right"></i>
                </div>

            </div>

            <div class="weekdays">
                <div>Sun</div>
                <div>Mon</div>
                <div>Tue</div>
                <div>Wed</div>
                <div>Thu</div>
                <div>Fri</div>
                <div>Sat</div>
            </div>

            <div class="days" id="days"></div>

        </div>

        <div class="stat-container">

            <div class="details">

                <h3>Miffy says keep it up!</h3>

                <div id="progress-bar">
                    <div id="progress"></div>
                </div>

                <p id="progress-percent">0%</p>

            </div>

            <div class="stats-number">
                <p id="numbers">0 / 0</p>
            </div>

        </div>

    </div>


    <div class="container">

        <div class="todo-app">

            <h1>Get Done w/ Miffy!</h1>

            <form class="input-area">

                <input
                    type="text"
                    id="task-input"
                    placeholder="Add a new task:"
                >

                <button type="submit" id="add-task-btn">
                    <i class="fa-solid fa-heart-circle-plus"></i>
                </button>

            </form>

            <div class="todos-container">

                <ul id="task-list"></ul>

                <div class="empty-state">

                    <p>Miffy doesn't see any tasks..</p>

                    <img
                        class="empty-image"
                        src="miffyempty.png"
                        alt="Miffy"
                    >

                </div>

            </div>

        </div>

    </div>

    <div class="music-container play">
        <div class="music-info">
            <h4 id="music-title">Noon</h4>
            <p id="artist">massobeats</p>
        </div>

        <audio src="music/noon.mp3" id="audio"></audio>
        <div class="img-container">
            <img src="disc images/noon.jpg" alt="music-cover" id="cover">
        </div>
        <div class="navigation">
            <button id="music-prev" class="action-btn">
                <i class="fas fa-backward"></i>
            </button>

            <button id="music-play" class="action-btn action-btn-big">
                <i class="fas fa-play"></i>
            </button>

            <button id="music-next" class="action-btn">
                <i class="fas fa-forward"></i>
            </button>
        </div>
        <div class="progress-container">
                <div class="progress"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
